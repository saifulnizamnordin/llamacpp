services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: llamacpp
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./models:/models
    environment:
      LLAMA_CACHE: /models
    command:
      - -hf
      - ${MODEL:-unsloth/Qwen3.6-35B-A3B-GGUF:UD-Q4_K_XL}
      - --ctx-size
      - "${CTX_SIZE:-16384}"
      - --threads
      - "${THREADS:-8}"
      - --flash-attn
      - "on"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 3600s
